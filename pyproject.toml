[project]
name = "triage-router"
version = "0.1.0"
description = "Support ticket triage router"
requires-python = ">=3.11"
dependencies = [
    "crewai[tools]>=0.80",
    "httpx>=0.27",
]

[project.scripts]
triage = "triage_router.cli:main"

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_router"]
